=============================================================================
File Name   : index.html
Project     : Rise of Kingdoms (ROK) Kingdom Account Management System
Author      : ROK Kingdom Management Team
Created     : 2026-10-21
Description : Bilingual frontend interface for player search, farm account 
              batch binding/unbinding, and high-KP warning display.
=============================================================================
-->
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Account Management | 账号管理系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f9;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .en-title {
            font-size: 0.8em;
            color: #666;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }

        input {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-sm-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.8em;
            border-radius: 3px;
            cursor: pointer;
            float: right;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }

        .success {
            color: #28a745;
            font-weight: bold;
            margin-top: 10px;
        }

        .warning-box {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        #gov-info {
            display: none;
        }

        .farm-list {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .farm-item {
            margin-bottom: 10px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .data-label {
            color: #666;
            font-size: 0.9em;
        }

        .kp-alert {
            color: #d9534f;
            font-weight: bold;
        }

        .preview-card {
            background: #e9ecef;
            border-left: 4px solid #007bff;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .staging-box {
            background: #f8f9fa;
            border: 1px dashed #007bff;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .staging-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .ch-badge {
            background: #17a2b8;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 style="margin-top: 0;">🔍 搜索账号 <span class="en-title">Search Player Account</span></h2>
        <input type="number" id="search-id" placeholder="请输入玩家 ID / Enter Player ID">
        <button onclick="searchGov()">搜 索 / Search</button>
        <p id="search-msg"></p>
    </div>

    <div class="card" id="gov-info">
        <div id="kp-warning-banner" class="warning-box" style="display:none;">
            ⚠️ <strong>警告 / Warning:</strong> 检测到绑定农场的 KP 高于主账号！/ Detected farm KP higher than main account!
        </div>

        <h2 id="g-name" style="margin-top: 0; color: #333;"></h2>
        <p><strong>ID:</strong> <span id="g-id"></span></p>
        <p><strong>市政厅等级 <span class="data-label">/ City Hall (CH):</span></strong> <span id="g-ch" class="ch-badge"></span></p>
        <p><strong>战力 <span class="data-label">/ Power:</span></strong> <span id="g-power"></span></p>
        <p><strong>击杀分 <span class="data-label">/ KP:</span></strong> <span id="g-kp"></span></p>
        <p><strong>绑定农场数 <span class="data-label">/ Farm Count:</span></strong> <span id="g-count"
                style="color: #007bff; font-weight: bold;"></span></p>

        <div class="farm-list" id="farm-list">
            <h4 style="margin-top: 0;">名下农场 <span class="data-label">/ Bound Farms:</span></h4>
            <div id="farms"></div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

        <!-- 绑定新农场区域 -->
        <h4 style="margin-top: 0;">➕ 绑定新农场 <span class="en-title" style="display:inline;">Bind New Farm</span></h4>
        
        <div style="display: flex; gap: 8px;">
            <input type="number" id="farm-id-input" placeholder="请输入农场 ID / Enter Farm ID" style="margin:0;">
            <button onclick="verifyFarm()" class="btn-secondary" style="width: auto; white-space: nowrap; margin:0;">验证账号 / Verify</button>
        </div>

        <!-- 预览确认卡片 -->
        <div id="farm-preview-card" class="preview-card" style="display:none;">
            <p style="margin:0 0 8px 0;">
                <strong>确认账号：</strong><span id="pv-name" style="color:#007bff; font-weight:bold;"></span> 
                | CH: <span id="pv-ch" class="ch-badge"></span>
                | 战力: <span id="pv-power"></span> 
                | KP: <span id="pv-kp"></span>
            </p>
            <button onclick="confirmAddToStaging()" class="btn-success" style="padding: 6px 12px; font-size: 0.9em; margin:0;">
                ＋ 确认无误，加入待绑定列表 / Add to List
            </button>
        </div>

        <!-- 待绑定暂存列表 -->
        <div id="staging-area" class="staging-box" style="display:none;">
            <h4 style="margin-top: 0; margin-bottom: 10px;">📋 待绑定列表 / Pending List (<span id="staging-count">0</span>)</h4>
            <div id="staging-list"></div>
            
            <button onclick="submitBatchBind()" class="btn-primary" style="margin-top: 10px; margin-bottom:0;">
                🚀 一键确认绑定以上所有小号 / Confirm All Bindings
            </button>
        </div>

        <p id="bind-msg"></p>

        <button onclick="closeInfo()" class="btn-danger" style="margin-top: 15px;">退出 / Exit</button>
    </div>

    <script>
        let currentMainId = null;
        let currentPreviewFarm = null;
        let stagingFarms = [];

        function searchGov(forceId = null) {
            const govId = forceId || document.getElementById('search-id').value;
            if (!govId) return;

            fetch(`/api/search/${govId}`)
                .then(response => response.json())
                .then(data => {
                    const msgEl = document.getElementById('search-msg');
                    if (data.status === 'error') {
                        msgEl.className = 'error';
                        msgEl.innerText = data.msg;
                        document.getElementById('gov-info').style.display = 'none';
                    } else if (data.status === 'redirect') {
                        msgEl.className = 'error';
                        msgEl.innerText = data.msg;
                        searchGov(data.main_id);
                    } else {
                        msgEl.innerText = '';
                        currentMainId = data.gov.id;
                        document.getElementById('g-name').innerText = data.gov.name;
                        document.getElementById('g-id').innerText = data.gov.id;
                        document.getElementById('g-ch').innerText = 'CH ' + (data.gov.ch || 'N/A');
                        document.getElementById('g-power').innerText = data.gov.power.toLocaleString();
                        document.getElementById('g-kp').innerText = data.gov.kp.toLocaleString();
                        document.getElementById('g-count').innerText = data.farm_count;

                        const warningBanner = document.getElementById('kp-warning-banner');
                        if (data.kp_warnings && data.kp_warnings.length > 0) {
                            warningBanner.style.display = 'block';
                        } else {
                            warningBanner.style.display = 'none';
                        }

                        const farmsDiv = document.getElementById('farms');
                        farmsDiv.innerHTML = '';
                        if (data.farm_count === 0) {
                            farmsDiv.innerHTML = '<p style="color:#888;">暂无绑定农场 / No farms bound yet</p>';
                        } else {
                            data.farms.forEach(f => {
                                const alertText = f.kp_warning ? `<span class="kp-alert"> (⚠️ 农场KP高 / High KP: ${f.kp.toLocaleString()})</span>` : '';
                                farmsDiv.innerHTML += `
                                    <div class="farm-item">
                                        <button onclick="unbindFarm(${f.id})" class="btn-sm-danger">解绑 / Unbind</button>
                                        <strong>${f.name}</strong> <span class="ch-badge">CH ${f.ch || 'N/A'}</span> (ID: ${f.id})<br>
                                        <small>战力/Power: ${f.power.toLocaleString()} | KP: ${f.kp.toLocaleString()}${alertText}</small>
                                    </div>
                                `;
                            });
                        }

                        resetBindArea();
                        document.getElementById('gov-info').style.display = 'block';
                    }
                });
        }

        // 1. 输入 ID 验证查询小号信息
        function verifyFarm() {
            const farmId = document.getElementById('farm-id-input').value.trim();
            const bindMsg = document.getElementById('bind-msg');
            bindMsg.innerText = '';

            if (!farmId) {
                bindMsg.className = 'error';
                bindMsg.innerText = '请先输入农场 ID！ / Please enter Farm ID!';
                return;
            }

            if (farmId == currentMainId) {
                bindMsg.className = 'error';
                bindMsg.innerText = '不能绑定自己！ / Cannot bind yourself!';
                return;
            }

            if (stagingFarms.some(f => f.id == farmId)) {
                bindMsg.className = 'error';
                bindMsg.innerText = '该农场已经在待绑定列表里了！ / Already in staging list!';
                return;
            }

            fetch(`/api/search/${farmId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'error') {
                        bindMsg.className = 'error';
                        bindMsg.innerText = data.msg;
                        document.getElementById('farm-preview-card').style.display = 'none';
                    } else if (data.status === 'redirect') {
                        bindMsg.className = 'error';
                        bindMsg.innerText = '警告：该账号已经被绑定为农场，无法重复绑定！';
                        document.getElementById('farm-preview-card').style.display = 'none';
                    } else {
                        currentPreviewFarm = data.gov;
                        document.getElementById('pv-name').innerText = currentPreviewFarm.name;
                        document.getElementById('pv-ch').innerText = 'CH ' + (currentPreviewFarm.ch || 'N/A');
                        document.getElementById('pv-power').innerText = Number(currentPreviewFarm.power).toLocaleString();
                        document.getElementById('pv-kp').innerText = Number(currentPreviewFarm.kp).toLocaleString();
                        document.getElementById('farm-preview-card').style.display = 'block';
                    }
                });
        }

        // 2. 确认加入暂存列表
        function confirmAddToStaging() {
            if (!currentPreviewFarm) return;
            
            stagingFarms.push(currentPreviewFarm);
            currentPreviewFarm = null;
            
            document.getElementById('farm-preview-card').style.display = 'none';
            document.getElementById('farm-id-input').value = '';
            document.getElementById('bind-msg').innerText = '';

            renderStagingList();
        }

        // 3. 渲染暂存列表
        function renderStagingList() {
            const listEl = document.getElementById('staging-list');
            const stagingArea = document.getElementById('staging-area');
            
            if (stagingFarms.length === 0) {
                stagingArea.style.display = 'none';
                return;
            }

            stagingArea.style.display = 'block';
            document.getElementById('staging-count').innerText = stagingFarms.length;
            
            listEl.innerHTML = stagingFarms.map((f, index) => `
                <div class="staging-item">
                    <span><strong>${f.name}</strong> <span class="ch-badge">CH ${f.ch || 'N/A'}</span> (ID: ${f.id}) - 战力: ${Number(f.power).toLocaleString()}</span>
                    <button onclick="removeFromStaging(${index})" style="color:#dc3545; background:none; border:none; cursor:pointer; font-weight:bold;">❌ 移除</button>
                </div>
            `).join('');
        }

        function removeFromStaging(index) {
            stagingFarms.splice(index, 1);
            renderStagingList();
        }

        // 4. 一键提交批量绑定
        function submitBatchBind() {
            if (stagingFarms.length === 0) return;
            
            const farmIds = stagingFarms.map(f => f.id);

            fetch('/api/bind', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ main_id: currentMainId, farm_ids: farmIds })
            })
            .then(res => res.json())
            .then(data => {
                const bindMsg = document.getElementById('bind-msg');
                bindMsg.innerHTML = data.msg;
                bindMsg.className = data.status === 'error' ? 'error' : 'success';

                if (data.status === 'success' || data.status === 'warning') {
                    stagingFarms = [];
                    renderStagingList();
                    searchGov(currentMainId);
                }
            });
        }

        function unbindFarm(farmId) {
            if (!confirm('确定要解绑该农场吗？ / Are you sure you want to unbind this farm?')) return;

            fetch('/api/unbind', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ farm_id: farmId })
            })
                .then(res => res.json())
                .then(data => {
                    alert(data.msg);
                    if (data.status === 'success') {
                        searchGov(currentMainId);
                    }
                });
        }

        function resetBindArea() {
            stagingFarms = [];
            currentPreviewFarm = null;
            document.getElementById('farm-id-input').value = '';
            document.getElementById('farm-preview-card').style.display = 'none';
            document.getElementById('bind-msg').innerText = '';
            renderStagingList();
        }

        function closeInfo() {
            document.getElementById('gov-info').style.display = 'none';
            document.getElementById('search-id').value = '';
            document.getElementById('search-msg').innerText = '';
            resetBindArea();
            currentMainId = null;
        }
    </script>
</body>

</html>
